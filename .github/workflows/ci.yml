name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  docker:
    name: Build, smoke-test, scan & publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # 1. Build locally so we can test and scan the exact image we will publish.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: portwatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Smoke test against a real service: nginx on :8080.
      - name: Smoke test
        run: |
          docker run -d --name web -p 8080:80 nginx:alpine
          sleep 3

          cat > /tmp/ok.yaml <<'YAML'
          targets:
            - host: 127.0.0.1
              expected_open: [8080]
              ports: "8080,9999"
          YAML
          docker run --rm --network host -v /tmp/ok.yaml:/config/t.yaml:ro \
            portwatch:ci scan -c /config/t.yaml

          # Expecting a port that is not open must produce exit code 1 (drift detected).
          cat > /tmp/drift.yaml <<'YAML'
          targets:
            - host: 127.0.0.1
              expected_open: [8080, 9999]
              ports: "8080,9999"
          YAML
          set +e
          docker run --rm --network host -v /tmp/drift.yaml:/config/t.yaml:ro \
            portwatch:ci scan -c /config/t.yaml
          code=$?
          set -e
          test "$code" -eq 1

      # 3. Fail the build on fixable HIGH/CRITICAL vulnerabilities.
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: portwatch:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # 4. Publish to GitHub Container Registry (not on pull requests).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
