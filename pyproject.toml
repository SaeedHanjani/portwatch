[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portwatch"
version = "0.1.0"
description = "Detect unexpected open ports and missing services (port drift) on networks you own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0", "prometheus-client>=0.19"]

[project.optional-dependencies]
dev = ["pytest>=9.2.0", "ruff>=0.5"]

[project.scripts]
portwatch = "portwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
